# ==============================================================================
# SpaceFin · Airflow 2.x 编排栈（备选形态：容器化）
# ------------------------------------------------------------------------------
# 组件：postgres(元数据库) + airflow-init + airflow-webserver + airflow-scheduler
# 执行器：LocalExecutor —— 采集本身已有自己的 Redis 队列派单，再引入 Celery/Redis
#         只是多余复杂度；DAG 的任务是「拉起 / 探活 / 等待 / 跑 ETL」，单机足够。
#
# ⚠️ 本文件是**备选**方案。推荐形态是宿主 systemd 直装 Airflow（见 README.md §1），
#    因为 DAG 的 Bash 任务要在**宿主**上跑 start_all.sh / docker compose / venv python，
#    容器化的 Airflow 默认做不到。若坚持用本文件，必须满足 README §1.2 的额外条件：
#    挂 docker.sock、挂仓库根、宿主网络可达（或改 network_mode: host）。
#
# 用法：
#   cd airflow && cp .env.example .env && vi .env   # 填 Fernet/密码，勿提交
#   mkdir -p logs plugins && echo "AIRFLOW_UID=$(id -u)" >> .env
#   docker compose -f docker-compose.airflow.yml up -d
# 校验（不启动）：docker compose -f docker-compose.airflow.yml config --quiet
# ==============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:?set in airflow/.env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?set in airflow/.env}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:?set in airflow/.env}
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Shanghai
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    TZ: Asia/Shanghai
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    # DAG 目录：本 compose 文件同级的 ./dags（内含 guangdong_daily_crawl.py）
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # 仓库根：DAG 的 cwd / venv / etl.py 都在这里；容器化时 Variable spacefin_repo_root
    # 必须设成容器内路径 /opt/spacefin（否则 Bash 任务找不到脚本）
    - ${SPACEFIN_REPO_ROOT:-..}:/opt/spacefin
    # 宿主 docker：DAG 里 start_all.sh 会调 docker compose 拉采集栈
    - /var/run/docker.sock:/var/run/docker.sock
  extra_hosts:
    # 容器内访问宿主 master(5100) / 渲染服务(8899)：
    # Variable spacefin_master_url / spacefin_render_url 要改成 http://host.docker.internal:PORT
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: spacefin-airflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in airflow/.env}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      TZ: Asia/Shanghai
    volumes:
      - airflow-postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow} -d ${POSTGRES_DB:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # 一次性初始化：建表 + 建管理员账号。跑完退出，不常驻，故不用 unless-stopped。
  airflow-init:
    <<: *airflow-common
    container_name: spacefin-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --role Admin \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:?set in airflow/.env}" \
          --firstname SpaceFin --lastname Admin \
          --email "${_AIRFLOW_WWW_USER_EMAIL:-admin@example.com}" \
          || echo "[init] admin user already exists, skip"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: spacefin-airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: spacefin-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-db:
