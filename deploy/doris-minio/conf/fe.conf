# ==============================================================================
# Doris FE 配置（覆盖镜像默认 /opt/apache-doris/fe/conf/fe.conf）
# ------------------------------------------------------------------------------
# 镜像默认 JVM 堆为 -Xmx8192m（8G），宿主整机仅 15G 内存且 MySQL/Redis/Airflow
# 常驻约 2.7G。若按默认 8G 启动，FE 会挤占内存导致 OOM，甚至拖垮宿主上其他组件。
# 本文件只改内存参数，端口等其余配置沿用官方默认（见 docker-compose.yml 端口段）。
# 注意：init_fe.sh 会在首次启动时检查本文件是否已含 priority_networks，未含则自动
# 追加，因此本文件所在挂载目录必须可写。我们直接在此显式写死 127.0.0.0/24（与
# FE_SERVERS=fe1:127.0.0.1:9010 一致），让 FE 固定以 127.0.0.1 对外公布，避免宿主机
# 上 docker 网桥地址（如 172.19.0.1）变化导致 FE 公布地址漂移。
# ==============================================================================

CUR_DATE=`date +%Y%m%d-%H%M%S`

# Log dir
LOG_DIR = ${DORIS_HOME}/log

# G1 JAVA OPTS —— 实际生效项：镜像内置 JDK 8，start_fe.sh 按 java_version 选择
# final_java_opt，JDK 8 命中默认 JAVA_OPTS。压到 2G 堆 + 1G 初始堆，满足本组件
# 数十万行量级数据，同时给 BE 与宿主其他服务留足内存。
JAVA_OPTS="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xss4m -Xmx2048m -Xms1024m -XX:+UnlockExperimentalVMOptions -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xloggc:$LOG_DIR/fe.gc.log.$CUR_DATE -Dlog4j2.formatMsgNoLookups=true"

# 兼容 JDK 9+ 的备选参数（当前镜像未用，一并压到 2G 防止日后镜像升级后踩 8G 默认）
JAVA_OPTS_FOR_JDK_9="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xss4m -Xmx2048m -XX:+UseG1GC -Xlog:gc*:$LOG_DIR/fe.gc.log.$CUR_DATE:time -Dlog4j2.formatMsgNoLookups=true"
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -XX:+UseG1GC -Xmx2048m -Xms1024m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$LOG_DIR/ -Xlog:gc*:$LOG_DIR/fe.gc.log.$CUR_DATE:time"

# ---- 端口（与官方默认一致，host 网络下直接落在宿主上）----
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = -1

# ---- 网段：host 网络下单 FE 以 127.0.0.1 自举，见文件头注释 ----
priority_networks = 127.0.0.0/24

# 日志
sys_log_level = INFO
sys_log_mode = NORMAL
