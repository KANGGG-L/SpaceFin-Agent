# SpaceFin 实时接入层（Workflow B）：Kafka 单 broker + Flink standalone（JM/TM）。
#
# 为什么这样搭：
# - Kafka 用官方 apache/kafka 镜像的 KRaft 单节点模式（无 ZooKeeper），4 核/15G 下
#   少一个常驻进程；单 broker 已满足「事件可收发」的验收，无需副本。
# - Flink 用 standalone（JobManager + 1 个 TaskManager）而非原生/集群模式：本机没有
#   Java/部署器的限制下，standalone 是官方镜像开箱即用、资源可精确上限的最轻形态。
# - 所有容器都加 mem_limit 防 OOM 拖垮宿主（宿主可用内存约 13G，见 free -h）。
# - 共享现有外部网络 spacefin-agent_default：让 Flink 容器直接以 service 名访问
#   业务 MySQL（spacefin-mysql），不用再开额外端口。
#
# 端口：
#   Kafka  9092/9093（controller 9094 仅容器内）
#   Flink  8081（REST/UI）、6123（JM RPC）、6124/6125（blob/query，容器内）
# 与现有服务（MySQL 3306、Redis 6379、Airflow 8080、Doris/MinIO 8030/9030 等）无冲突。

name: spacefin-realtime

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: spacefin-kafka
    mem_limit: 1536m
    environment:
      # KRaft 单节点：broker+controller 合一，节点 id 固定，quorum 指向自身。
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9094
      # 三个 listener：INTERNAL 供容器内 Flink 用（kafka:9093），EXTERNAL 供宿主
      # 上 python producer/consumer 用（localhost:9092），CONTROLLER 是 KRaft 内网。
      KAFKA_LISTENERS: INTERNAL://:9093,EXTERNAL://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 单 broker 必须把副本因子压到 1，否则内部 topic 创建失败。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # broker JVM 上限 1G，容器再留一点余量给页缓存，见下 mem_limit。
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - spacefin

  flink-jobmanager:
    image: apache/flink:1.19.1
    container_name: flink-jobmanager
    command: jobmanager
    mem_limit: 1536m
    environment:
      # TM 靠 jobmanager.rpc.address 找 JM；容器名即服务名，写入环境变量让脚本拼进配置。
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      # FLINK_PROPERTIES 会被 entrypoint 以 -D 形式写进 conf/config.yaml，覆盖默认的
      # 1600m 进程内存（本机内存紧，压到 1024m），并让 sql-client 用服务名而非 0.0.0.0。
      FLINK_PROPERTIES: |
        jobmanager.memory.process.size: 1024m
        rest.address: flink-jobmanager
    ports:
      - "8081:8081"
      - "6123:6123"
    volumes:
      # 连接器 jar 以单文件方式 bind 进 /opt/flink/lib（不能用目录挂载，会盖掉发行版自带 jar）。
      - ./jars/flink-sql-connector-kafka-3.3.0-1.19.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar:ro
      - ./jars/flink-connector-jdbc-3.2.0-1.19.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.19.jar:ro
      - ./jars/mysql-connector-j-8.0.33.jar:/opt/flink/lib/mysql-connector-j-8.0.33.jar:ro
      # 实时联动 SQL 作业脚本，容器内用 sql-client 提交。
      - ../../tools/stream/sql:/opt/flink/sql:ro
    networks:
      - spacefin

  flink-taskmanager:
    image: apache/flink:1.19.1
    container_name: flink-taskmanager
    command: taskmanager
    mem_limit: 1536m
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      FLINK_PROPERTIES: |
        taskmanager.memory.process.size: 1024m
    volumes:
      - ./jars/flink-sql-connector-kafka-3.3.0-1.19.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.19.jar:ro
      - ./jars/flink-connector-jdbc-3.2.0-1.19.jar:/opt/flink/lib/flink-connector-jdbc-3.2.0-1.19.jar:ro
      - ./jars/mysql-connector-j-8.0.33.jar:/opt/flink/lib/mysql-connector-j-8.0.33.jar:ro
    networks:
      - spacefin

networks:
  spacefin:
    external: true
    name: spacefin-agent_default
