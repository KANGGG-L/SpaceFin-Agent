[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["docs/poc/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 测试文件：中文标识符命名（断言语义直读）/ assert False 惯用法 / sys.path 注入后本地导入，
# 都是有意为之，不按生产代码口径要求。
"tools/**/tests/*.py" = ["N802", "N806", "B011", "E402"]
# 脚本入口：先设 sys.path / 环境变量再导入同目录模块，属有意为之。
"tools/frontend/app.py" = ["E402"]
"tools/frontend/sandbox_agent.py" = ["E402"]
"tools/risk/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
# experiments/ 下的 test_*.py 是反爬技术选型的探索脚本（零 assert、零 def test_，
# docstring 自述「实验」），只因命名前缀被 pytest 误收集，且依赖 selenium_stealth /
# undetected_chromedriver 等未安装的可选包 → 会让 `pytest tools/` 整体收集失败。
# 保留文件本身（是有价值的选型记录），仅排除出测试收集。
norecursedirs = ["tools/anjuke_crawler/experiments", "*/__pycache__", ".git"]
