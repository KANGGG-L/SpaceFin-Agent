name: "CodeQL"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "0 0 * * 1" # 每周一凌晨运行

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 按需增加 queries: security-extended, security-and-quality
          # queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # 私有仓库未启用 code scanning（需 Advanced Security）时 SARIF 上传会直接报错
          # 「Code scanning is not enabled」→ 整个 job 失败。先关闭上传，仅做静态分析；
          # 若仓库转公开或在 Settings → Code security 开启 code scanning，可改回 true。
          upload: false
